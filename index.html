<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>木工用パラメトリック・パーツボックス・ジェネレーター</title>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <script src="https://unpkg.com/@jscad/modeling@2.2.0/dist/jscad-modeling.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; height: 100vh; overflow: hidden; background: #f5f5f7; color: #334155; }
        #sidebar { width: 360px; background: #fff; padding: 18px; box-sizing: border-box; border-right: 1px solid #e2e8f0; overflow-y: auto; flex-shrink: 0; }
        #main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        #viewer { flex: 1; position: relative; background: #eef2f5; }
        #status-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 6px 10px;
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.8);
            color: #f8fafc;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
        }
        #status-indicator.active { opacity: 1; }
        #cutlist-container { height: 250px; border-top: 1px solid #e2e8f0; background: #fff; padding: 12px; box-sizing: border-box; overflow: auto; }
        h2 { margin: 0 0 12px 0; font-size: 1.1rem; }
        h3 { margin: 0 0 8px 0; font-size: 1rem; }
        .param-group { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed #e2e8f0; }
        .param-label { font-size: 0.85rem; margin-bottom: 3px; font-weight: 700; }
        .param-controls { display: flex; gap: 8px; align-items: center; }
        .param-controls input[type="range"] { flex: 1; }
        .param-controls input[type="number"] { width: 84px; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: right; }
        .info-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; padding: 8px 10px; font-size: 0.8rem; line-height: 1.4; color: #166534; margin: 10px 0; }
        #btn-download { width: 100%; border: 0; border-radius: 6px; padding: 10px; cursor: pointer; color: #fff; background: #2563eb; font-weight: 700; font-size: 0.95rem; }
        #btn-download:hover { background: #1d4ed8; }
        pre { margin: 0; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; padding: 10px; font-size: 0.85rem; white-space: pre-wrap; line-height: 1.4; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>木工用パラメトリック・パーツボックス・ジェネレーター</h2>
        <div id="controls-root"></div>
        <div class="info-box">
            <strong>木工自動固定ルール</strong><br>
            ・底板溝の幅 = 板厚 t の 1/3<br>
            ・底板溝の深さ = 板厚 t の 1/3<br>
            ・溝位置 = 底面から板厚 t の高さ<br>
            ・前方飛び出し口 = 45度傾斜カット
        </div>
        <button id="btn-download">STL をエクスポート</button>
    </div>

    <div id="main-content">
        <div id="viewer">
            <div id="status-indicator">JSCAD 計算中...</div>
        </div>
        <div id="cutlist-container">
            <h3>リアルタイム木取り図（カットリスト）</h3>
            <pre id="cutlist-text">計算待機中...</pre>
        </div>
    </div>

<script>
// ─── パラメータ定義 ──────────────────────────────────────────────
const PARAM_DEFS = [
    { id: 'baseD',     name: '基本基準サイズ d (mm)', min: 50,  max: 300, step: 1,   value: 140 },
    { id: 'ratioX',    name: '幅比率 (X比率)',        min: 0.2, max: 3.0, step: 0.1, value: 1.0 },
    { id: 'ratioY',    name: '奥行比率 (Y比率)',      min: 0.2, max: 3.0, step: 0.1, value: 1.0 },
    { id: 'ratioZ',    name: '高さ比率 (Z比率)',      min: 0.2, max: 3.0, step: 0.01,value: 1.5 },
    { id: 'thickness', name: '板厚 t (mm)',           min: 3,   max: 30,  step: 0.5, value: 9   }
];

const paramValues = {};
let scene, camera, renderer, controls, modelGroup, latestMesh;
let updateTimer = null;
let computeRunning = false;
let computeQueued = false;
let requestVersion = 0;

// ─── ステータス表示 ───────────────────────────────────────────────
function setStatus(active, text) {
    const node = document.getElementById('status-indicator');
    if (text) node.textContent = text;
    node.classList.toggle('active', !!active);
}

// ─── UI 初期化 ────────────────────────────────────────────────────
function initUI() {
    const root = document.getElementById('controls-root');
    PARAM_DEFS.forEach((p) => {
        paramValues[p.id] = p.value;

        const group = document.createElement('div');
        group.className = 'param-group';

        const label = document.createElement('div');
        label.className = 'param-label';
        label.textContent = p.name;

        const controlsDiv = document.createElement('div');
        controlsDiv.className = 'param-controls';

        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = p.min; slider.max = p.max; slider.step = p.step; slider.value = p.value;

        const number = document.createElement('input');
        number.type = 'number';
        number.min = p.min; number.max = p.max; number.step = p.step; number.value = p.value;

        function updateValue(raw) {
            let v = parseFloat(raw);
            if (!Number.isFinite(v)) v = p.value;
            v = Math.max(p.min, Math.min(p.max, v));
            slider.value = v;
            number.value = v;
            paramValues[p.id] = v;
            scheduleGeometryUpdate();
        }

        slider.addEventListener('input',  (e) => updateValue(e.target.value));
        number.addEventListener('change', (e) => updateValue(e.target.value));

        controlsDiv.appendChild(slider);
        controlsDiv.appendChild(number);
        group.appendChild(label);
        group.appendChild(controlsDiv);
        root.appendChild(group);
    });

    document.getElementById('btn-download').addEventListener('click', downloadSTL);
}

// ─── Three.js 初期化 ──────────────────────────────────────────────
function initThree() {
    const container = document.getElementById('viewer');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeef2f5);

    camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 1, 6000);
    camera.position.set(280, 220, -380);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const d1 = new THREE.DirectionalLight(0xffffff, 0.75);
    d1.position.set(220, 330, 200);
    scene.add(d1);
    const d2 = new THREE.DirectionalLight(0xa5b4fc, 0.35);
    d2.position.set(-180, 220, -210);
    scene.add(d2);

    const grid = new THREE.GridHelper(900, 90, 0x94a3b8, 0xcbd5e1);
    scene.add(grid);

    modelGroup = new THREE.Group();
    scene.add(modelGroup);

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    animate();
}

function animate() {
    requestAnimationFrame(animate);
    if (controls) controls.update();
    if (renderer && scene && camera) renderer.render(scene, camera);
}

// ─── 更新スケジューリング（デバウンス） ─────────────────────────
function scheduleGeometryUpdate() {
    requestVersion += 1;
    if (updateTimer) clearTimeout(updateTimer);
    setStatus(true, 'JSCAD 計算中...');
    updateTimer = setTimeout(() => runGeometryUpdate(requestVersion), 80);
}

function runGeometryUpdate(version) {
    if (computeRunning) {
        computeQueued = true;
        return;
    }
    computeRunning = true;

    setTimeout(() => {
        try {
            const dims = calculateDimensions();
            const triangles = buildSolidWithJscad(dims);

            if (version === requestVersion) {
                applyModel(triangles, dims);
                updateCutList(dims);
                setStatus(false);
            }
        } catch (err) {
            console.error('JSCAD error:', err);
            setStatus(true, 'エラー: ' + err.message);
        }

        computeRunning = false;

        if (computeQueued || version !== requestVersion) {
            computeQueued = false;
            runGeometryUpdate(requestVersion);
        }
    }, 0);
}

// ─── 寸法計算 ────────────────────────────────────────────────────
function calculateDimensions() {
    const d = paramValues.baseD;
    const W = d * paramValues.ratioX;
    const L = d * paramValues.ratioY;
    const H = d * paramValues.ratioZ;
    const t = Math.min(paramValues.thickness, W / 4, L / 4, H / 2.5);

    const grooveWidth  = t / 3;
    const grooveDepth  = t / 3;
    const grooveCenterY = -H / 2 + 5 * t / 6;

    return { d, W, L, H, t, grooveWidth, grooveDepth, grooveCenterY };
}

// ─── JSCAD CSG → 三角形配列 ─────────────────────────────────────
function buildSolidWithJscad(dims) {
    const modeling = window.jscadModeling;
    if (!modeling) throw new Error('jscadModeling が読み込まれていません');

    const { cuboid }             = modeling.primitives;
    const { subtract, union }    = modeling.booleans;
    const { translate, rotateX } = modeling.transforms;
    const { geom3 }              = modeling.geometries;

    const d = dims;

    const innerW = Math.max(1, d.W - 2 * d.t);
    const innerD = Math.max(1, d.L - 2 * d.t);

    // 外殻ボックス
    const outer = cuboid({ size: [d.W, d.H, d.L] });

    // 内側くり抜き（底板厚t、上面開放）
    const inner = translate(
        [0, d.t / 2, 0],
        cuboid({ size: [innerW, Math.max(1, d.H - d.t), innerD] })
    );

    // 底板はめ込み溝（左・右・背板の3面のみ、前面は開放）
    const grooveLeft = translate(
        [-d.W / 2 + d.t - d.grooveDepth / 2, d.grooveCenterY, 0],
        cuboid({ size: [d.grooveDepth, d.grooveWidth, innerD] })
    );
    const grooveRight = translate(
        [ d.W / 2 - d.t + d.grooveDepth / 2, d.grooveCenterY, 0],
        cuboid({ size: [d.grooveDepth, d.grooveWidth, innerD] })
    );
    const grooveBack = translate(
        [0, d.grooveCenterY, d.L / 2 - d.t + d.grooveDepth / 2],
        cuboid({ size: [innerW, d.grooveWidth, d.grooveDepth] })
    );

    // 傾斜カット
    // 切断平面: A=(y=H/2, z=L/2-t)  B=(y=-H/2, z=-L/2)
    // 中点M=(y=0, z=-t/2), 法線方向=(L-t, -H)/mag
    const Leff  = d.L - d.t;
    const mag   = Math.sqrt(d.H * d.H + Leff * Leff);
    const alpha = Math.atan2(-d.H, Leff);
    const H_c   = 2.5 * mag;
    const cutter_y = (H_c / 2) * (Leff / mag);
    const cutter_z = (-d.t / 2) - (H_c / 2) * (d.H / mag);

    const slopeCutter = translate(
        [0, cutter_y, cutter_z],
        rotateX(alpha, cuboid({ size: [d.W * 1.5, H_c, H_c] }))
    );

    const shell = subtract(outer, inner, grooveLeft, grooveRight, grooveBack, slopeCutter);

    // 底板（左右溝・背板溝にはまり込む）
    const bottomW     = Math.max(1, innerW + 2 * d.grooveDepth);
    const bottomSizeZ = Math.max(1, innerD + d.grooveDepth);
    const bottomPlate = translate(
        [0, d.grooveCenterY, d.grooveDepth / 2],
        cuboid({ size: [bottomW, d.grooveWidth, bottomSizeZ] })
    );

    const unified = union(shell, bottomPlate);

    // toPolygons() → ファン三角形分割
    const polygons = geom3.toPolygons(unified);
    const triangles = [];
    for (const poly of polygons) {
        const verts = poly.vertices;
        for (let i = 1; i < verts.length - 1; i++) {
            triangles.push([verts[0], verts[i], verts[i + 1]]);
        }
    }

    return triangles;
}

// ─── JSCAD三角形配列 → Three.js BufferGeometry ──────────────────
function trianglesToThreeGeometry(triangles) {
    const positions = new Float32Array(triangles.length * 9);
    const normals   = new Float32Array(triangles.length * 9);
    let p = 0;

    for (const tri of triangles) {
        const [ax, ay, az] = tri[0];
        const [bx, by, bz] = tri[1];
        const [cx, cy, cz] = tri[2];

        positions[p]   = ax; positions[p+1] = ay; positions[p+2] = az;
        positions[p+3] = bx; positions[p+4] = by; positions[p+5] = bz;
        positions[p+6] = cx; positions[p+7] = cy; positions[p+8] = cz;

        const abx = bx-ax, aby = by-ay, abz = bz-az;
        const acx = cx-ax, acy = cy-ay, acz = cz-az;
        let nx = aby*acz - abz*acy;
        let ny = abz*acx - abx*acz;
        let nz = abx*acy - aby*acx;
        const nl = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
        nx /= nl; ny /= nl; nz /= nl;

        normals[p]   = nx; normals[p+1] = ny; normals[p+2] = nz;
        normals[p+3] = nx; normals[p+4] = ny; normals[p+5] = nz;
        normals[p+6] = nx; normals[p+7] = ny; normals[p+8] = nz;
        p += 9;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('normal',   new THREE.BufferAttribute(normals,   3));
    geo.computeBoundingSphere();
    return geo;
}

// ─── モデルグループをクリア ───────────────────────────────────────
function clearModelGroup() {
    while (modelGroup.children.length > 0) {
        const child = modelGroup.children[0];
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
            (Array.isArray(child.material) ? child.material : [child.material])
                .forEach((m) => m.dispose());
        }
        modelGroup.remove(child);
    }
}

// ─── 三角形 → Three.js に適用 ─────────────────────────────────────
function applyModel(triangles, dims) {
    clearModelGroup();
    if (!triangles || triangles.length === 0) return;

    const geometry = trianglesToThreeGeometry(triangles);
    const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
        color: 0xc97a2b,
        roughness: 0.58,
        metalness: 0.06
    }));
    const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geometry),
        new THREE.LineBasicMaterial({ color: 0x5b3414 })
    );

    modelGroup.add(mesh);
    modelGroup.add(edges);
    latestMesh = mesh;

    modelGroup.position.set(0, dims.H / 2, 0);
}

// ─── カットリスト更新 ─────────────────────────────────────────────
function updateCutList(d) {
    const innerW  = Math.max(0, d.W - 2 * d.t);
    const innerD  = Math.max(0, d.L - 2 * d.t);
    const bottomW = Math.max(0, innerW + 2 * d.grooveDepth);
    const bottomD = Math.max(0, innerD + d.grooveDepth);

    const Leff       = d.L - d.t;
    const slopeAngle = Math.atan2(d.H, Leff) * 180 / Math.PI;

    document.getElementById('cutlist-text').textContent =
`【木取り図 / カットリスト（mm）】
────────────────────────────────────────
外寸: 幅 ${d.W.toFixed(1)} × 奥行 ${d.L.toFixed(1)} × 高さ ${d.H.toFixed(1)}

側板（左・右 各1枚 計2枚）※台形
  厚み ${d.t.toFixed(1)} × 奥行 ${d.L.toFixed(1)} × 背面高さ ${d.H.toFixed(1)}
  （前面に向けて ${slopeAngle.toFixed(1)}° で傾斜、前面高さ ≈ 0）

背板（1枚）
  厚み ${d.t.toFixed(1)} × 幅 ${innerW.toFixed(1)} × 高さ ${d.H.toFixed(1)}

底板（1枚・溝にはめ込む）
  厚み ${d.grooveWidth.toFixed(1)} × 幅 ${bottomW.toFixed(1)} × 奥行 ${bottomD.toFixed(1)}

【自動設定された溝仕様】
  溝幅   : ${d.grooveWidth.toFixed(1)} mm（板厚 ${d.t.toFixed(1)} の 1/3）
  溝深さ : ${d.grooveDepth.toFixed(1)} mm（板厚 ${d.t.toFixed(1)} の 1/3）
  溝位置 : 底面から ${(5*d.t/6).toFixed(1)} mm 上（中心）
  溝設置面: 側板（左右）+ 背板 の3面のみ（前面は開放）`;
}

// ─── STL エクスポート ─────────────────────────────────────────────
function downloadSTL() {
    if (!latestMesh) { alert('モデルが生成されていません'); return; }
    const exporter = new THREE.STLExporter();
    const result   = exporter.parse(latestMesh, { binary: true });
    const blob     = new Blob([result], { type: 'application/octet-stream' });
    const link     = document.createElement('a');
    link.href      = URL.createObjectURL(blob);
    link.download  = 'partsbox-solid.stl';
    link.click();
    URL.revokeObjectURL(link.href);
}

// ─── 起動 ─────────────────────────────────────────────────────────
window.onload = () => {
    initUI();
    initThree();
    scheduleGeometryUpdate();
};
</script>
</body>
</html>
